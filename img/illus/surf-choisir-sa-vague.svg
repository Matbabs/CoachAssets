<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 232" width="340" height="232"><rect width="340" height="232" rx="15" fill="#F4EEFC"/><text x="16" y="24" font-family="Inter, sans-serif" font-weight="700" font-size="13" fill="#1A0F2B" text-anchor="start">Droite, gauche ou fermeture ?</text><g transform="translate(16,40)"><rect x="0" y="0" width="96" height="80" rx="8" fill="#DBEAFE"/><polyline points="14,44 82,52" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="14" cy="44" r="7" fill="#FFFFFF"/><line x1="20" y1="62" x2="71.8" y2="67.6" stroke="#F97316" stroke-width="3.5" stroke-linecap="round"/><polygon points="76,68 69.5,70.7 70.2,64.0" fill="#F97316"/></g><text x="64" y="138" font-family="Inter, sans-serif" font-weight="700" font-size="11" fill="#1A0F2B" text-anchor="middle">Droite</text><g transform="translate(122,40)"><rect x="0" y="0" width="96" height="80" rx="8" fill="#DBEAFE"/><polyline points="14,52 82,44" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="82" cy="44" r="7" fill="#FFFFFF"/><line x1="76" y1="62" x2="24.2" y2="67.6" stroke="#F97316" stroke-width="3.5" stroke-linecap="round"/><polygon points="20,68 25.8,64.0 26.5,70.7" fill="#F97316"/></g><text x="170" y="138" font-family="Inter, sans-serif" font-weight="700" font-size="11" fill="#1A0F2B" text-anchor="middle">Gauche</text><g transform="translate(228,40)"><rect x="0" y="0" width="96" height="80" rx="8" fill="#DBEAFE"/><polyline points="14,48 82,48" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><polyline points="38,60 58,72" fill="none" stroke="#EF4444" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polyline points="58,60 38,72" fill="none" stroke="#EF4444" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><text x="276" y="138" font-family="Inter, sans-serif" font-weight="700" font-size="11" fill="#1A0F2B" text-anchor="middle">Fermeture</text><text x="16" y="200" font-family="Inter, sans-serif" font-weight="600" font-size="11" fill="#1A0F2B" text-anchor="start">Vue depuis le line-up, face à la plage.</text><text x="16" y="218" font-family="Inter, sans-serif" font-weight="600" font-size="11" fill="#1A0F2B" text-anchor="start">Une vague qui casse d'un coup partout : laisse-la passer.</text></svg>