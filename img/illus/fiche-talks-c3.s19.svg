 pour explorer, c’est grimper pour</text><text x="42" y="199" font-family="Inter, sans-serif" font-weight="600" font-size="11" fill="#1A0F2B" text-anchor="start">apprendre</text><circle cx="25" cy="219" r="9" fill="#FBBF24"/><text x="25" y="223" font-family="Inter, sans-serif" font-weight="700" font-size="11" fill="#1A0F2B" text-anchor="middle">3</text><text x="42" y="223" font-family="Inter, sans-serif" font-weight="600" font-size="11" fill="#1A0F2B" text-anchor="start">Et si progresser, c’était avant tout explorer ?</text><circle cx="25" cy="243" r="9" fill="#FBBF24"/><text x="25" y="247" font-family="Inter, sans-serif" font-weight="700" font-size="11" fill="#1A0F2B" text-anchor="middle">4</text><text x="42" y="247" font-family="Inter, sans-serif" font-weight="600" font-size="11" fill="#1A0F2B" text-anchor="start">Reviens-y souvent</text></svg>