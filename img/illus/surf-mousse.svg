<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 232" width="340" height="232"><rect width="340" height="232" rx="15" fill="#F4EEFC"/><text x="16" y="24" font-family="Inter, sans-serif" font-weight="700" font-size="13" fill="#1A0F2B" text-anchor="start">Glisser droit dans la mousse</text><rect x="14" y="34" width="312" height="114" fill="#DBEAFE"/><rect x="14" y="148" width="312" height="30" fill="#FDE68A"/><polyline points="24,70 316,70" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><polyline points="24,110 316,110" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="320" y="172" font-family="Inter, sans-serif" font-weight="600" font-size="10" fill="#1A0F2B" text-anchor="end">plage</text><text x="320" y="48" font-family="Inter, sans-serif" font-weight="600" font-size="10" fill="#3B82F6" text-anchor="end">large</text><path d="M170,100 C170.0,108.3 170.0,141.7 170,150" fill="none" stroke="#6D28D9" stroke-width="3.5" stroke-linecap="round"/><polygon points="170,150 165.7,142.1 174.3,142.1" fill="#6D28D9"/><circle cx="170" cy="96" r="6" fill="#FBBF24" stroke="#FFFFFF" stroke-width="2"/><text x="196" y="128" font-family="Inter, sans-serif" font-weight="700" font-size="10" fill="#6D28D9" text-anchor="start">planche perpendiculaire</text><text x="196" y="142" font-family="Inter, sans-serif" font-weight="700" font-size="10" fill="#6D28D9" text-anchor="start">à la mousse</text><text x="16" y="200" font-family="Inter, sans-serif" font-weight="600" font-size="11" fill="#1A0F2B" text-anchor="start">Pars juste devant la mousse, rame 3 coups de plus.</text><text x="16" y="218" font-family="Inter, sans-serif" font-weight="600" font-size="11" fill="#1A0F2B" text-anchor="start">Regard loin devant, poids centré.</text></svg>