<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 244" width="340" height="244"><rect width="340" height="244" rx="15" fill="#F4EEFC"/><text x="16" y="24" font-family="Inter, sans-serif" font-weight="700" font-size="13" fill="#1A0F2B" text-anchor="start">Le Souffle (au sec)</text><rect x="16" y="82" width="69" height="26" rx="6" fill="#B9A2EE"/><text x="50.5" y="99" font-family="Inter, sans-serif" font-weight="700" font-size="11" fill="#1A0F2B" text-anchor="middle">Niv. 1</text><rect x="91" y="68" width="69" height="40" rx="6" fill="#6D28D9"/><text x="125.5" y="85" font-family="Inter, sans-serif" font-weight="700" font-size="11" fill="#FFFFFF" text-anchor="middle">Niv. 2</text><rect x="166" y="54" width="69" height="54" rx="6" fill="#F97316"/><text x="200.5" y="71" font-family="Inter, sans-serif" font-weight="700" font-size="11" fill="#FFFFFF" text-anchor="middle">Niv. 3</text><rect x="241" y="40" width="69" height="68" rx="6" fill="#FBBF24"/><text x="275.5" y="57" font-family="Inter, sans-serif" font-weight="700" font-size="11" fill="#1A0F2B" text-anchor="middle">Niv. 4</text><circle cx="25" cy="126" r="9" fill="#FBBF24"/><text x="25" y="130" font-family="Inter, sans-serif" font-weight="700" font-size="11" fill="#1A0F2B" text-anchor="middle">1</text><text x="42" y="130" font-family="Inter, sans-serif" font-weight="600" font-size="11" fill="#1A0F2B" text-anchor="start">Débutant : ≈ 30 s</text><circle cx="25" cy="150" r="9" fill="#FBBF24"/><text x="25" y="154" font-family="Inter, sans-serif" font-weight="700" font-size="11" fill="#1A0F2B" text-anchor="middle">2</text><text x="42" y="154" font-family="Inter, sans-serif" font-weight="600" font-size="11" fill="#1A0F2B" text-anchor="start">Intermédiaire : ≈ 60 s</text><circle cx="25" cy="174" r="9" fill="#FBBF24"/><text x="25" y="178" font-family="Inter, sans-serif" font-weight="700" font-size="11" fill="#1A0F2B" text-anchor="middle">3</text><text x="42" y="178" font-family="Inter, sans-serif" font-weight="600" font-size="11" fill="#1A0F2B" text-anchor="start">Confirmé : ≈ 90 s</text><circle cx="25" cy="198" r="9" fill="#FBBF24"/><text x="25" y="202" font-family="Inter, sans-serif" font-weight="700" font-size="11" fill="#1A0F2B" text-anchor="middle">4</text><text x="42" y="202" font-family="Inter, sans-serif" font-weight="600" font-size="11" fill="#1A0F2B" text-anchor="start">Expert : 2 min et plus</text><text x="16" y="228" font-family="Inter, sans-serif" font-weight="600" font-size="11" fill="#6D28D9" text-anchor="start">2′ de respiration calme, allongé, jamais dans l'eau.</text></svg>