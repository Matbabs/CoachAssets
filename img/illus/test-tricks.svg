<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 236" width="340" height="236"><rect width="340" height="236" rx="15" fill="#F4EEFC"/><text x="16" y="24" font-family="Inter, sans-serif" font-weight="700" font-size="13" fill="#1A0F2B" text-anchor="start">Les Tricks basiques (Skateboard)</text><rect x="16" y="68" width="94" height="26" rx="6" fill="#B9A2EE"/><text x="63.0" y="85" font-family="Inter, sans-serif" font-weight="700" font-size="11" fill="#1A0F2B" text-anchor="middle">Niv. 1</text><rect x="116" y="54" width="94" height="40" rx="6" fill="#6D28D9"/><text x="163.0" y="71" font-family="Inter, sans-serif" font-weight="700" font-size="11" fill="#FFFFFF" text-anchor="middle">Niv. 2</text><rect x="216" y="40" width="94" height="54" rx="6" fill="#F97316"/><text x="263.0" y="57" font-family="Inter, sans-serif" font-weight="700" font-size="11" fill="#FFFFFF" text-anchor="middle">Niv. 3</text><circle cx="25" cy="112" r="9" fill="#FBBF24"/><text x="25" y="116" font-family="Inter, sans-serif" font-weight="700" font-size="11" fill="#1A0F2B" text-anchor="middle">1</text><text x="42" y="116" font-family="Inter, sans-serif" font-weight="600" font-size="11" fill="#1A0F2B" text-anchor="start">Shuv-it (faire tourner la planche sous tes</text><text x="42" y="131" font-family="Inter, sans-serif" font-weight="600" font-size="11" fill="#1A0F2B" text-anchor="start">pieds sans saut)</text><circle cx="25" cy="151" r="9" fill="#FBBF24"/><text x="25" y="155" font-family="Inter, sans-serif" font-weight="700" font-size="11" fill="#1A0F2B" text-anchor="middle">2</text><text x="42" y="155" font-family="Inter, sans-serif" font-weight="600" font-size="11" fill="#1A0F2B" text-anchor="start">180 front ou back (rotation complète en</text><text x="42" y="170" font-family="Inter, sans-serif" font-weight="600" font-size="11" fill="#1A0F2B" text-anchor="start">l'air)</text><circle cx="25" cy="190" r="9" fill="#FBBF24"/><text x="25" y="194" font-family="Inter, sans-serif" font-weight="700" font-size="11" fill="#1A0F2B" text-anchor="middle">3</text><text x="42" y="194" font-family="Inter, sans-serif" font-weight="600" font-size="11" fill="#1A0F2B" text-anchor="start">Kickflip ou Heelflip (flip de la planche)</text><text x="16" y="220" font-family="Inter, sans-serif" font-weight="600" font-size="11" fill="#6D28D9" text-anchor="start">Valide un niveau avant de passer au suivant.</text></svg>