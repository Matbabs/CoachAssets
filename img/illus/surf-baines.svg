<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 232" width="340" height="232"><rect width="340" height="232" rx="15" fill="#F4EEFC"/><text x="16" y="24" font-family="Inter, sans-serif" font-weight="700" font-size="13" fill="#1A0F2B" text-anchor="start">Lire la plage : la baïne</text><rect x="14" y="34" width="312" height="114" fill="#DBEAFE"/><rect x="14" y="148" width="312" height="30" fill="#FDE68A"/><polyline points="24,60 140,63" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><polyline points="200,63 316,60" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><polyline points="24,92 140,95" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><polyline points="200,95 316,92" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><polyline points="24,122 140,125" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><polyline points="200,125 316,122" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="320" y="172" font-family="Inter, sans-serif" font-weight="600" font-size="10" fill="#1A0F2B" text-anchor="end">plage</text><text x="320" y="48" font-family="Inter, sans-serif" font-weight="600" font-size="10" fill="#3B82F6" text-anchor="end">large</text><rect x="140" y="34" width="60" height="114" fill="#3B82F6" opacity="0.18"/><line x1="170" y1="140" x2="170.0" y2="64.2" stroke="#F97316" stroke-width="3.5" stroke-linecap="round"/><polygon points="170,60 173.4,66.1 166.6,66.1" fill="#F97316"/><text x="170" y="50" font-family="Inter, sans-serif" font-weight="700" font-size="10" fill="#F97316" text-anchor="middle">courant</text><line x1="220" y1="80" x2="285.8" y2="80.0" stroke="#6D28D9" stroke-width="3.5" stroke-linecap="round"/><polygon points="290,80 283.9,83.4 283.9,76.6" fill="#6D28D9"/><text x="255" y="72" font-family="Inter, sans-serif" font-weight="700" font-size="10" fill="#6D28D9" text-anchor="middle">rame parallèle</text><polyline points="70,168 70,146" fill="none" stroke="#1A0F2B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="70,146 84,151 70,156" fill="#10B981"/><polyline points="100,168 100,146" fill="none" stroke="#1A0F2B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="100,146 114,151 100,156" fill="#EF4444"/><text x="85" y="186" font-family="Inter, sans-serif" font-weight="600" font-size="10" fill="#1A0F2B" text-anchor="middle">zone surveillée</text><text x="16" y="200" font-family="Inter, sans-serif" font-weight="600" font-size="11" fill="#1A0F2B" text-anchor="start">Eau plus sombre et calme, pas de vagues : c'est le chenal.</text><text x="16" y="218" font-family="Inter, sans-serif" font-weight="600" font-size="11" fill="#1A0F2B" text-anchor="start">Emporté ? Ne lutte pas, rame parallèle à la plage.</text></svg>