<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 301" width="340" height="301"><rect width="340" height="301" rx="15" fill="#F4EEFC"/><defs><clipPath id="c-fiche-talks-c3.s16"><rect x="10" y="10" width="320" height="104" rx="12"/></clipPath></defs><g clip-path="url(#c-fiche-talks-c3.s16)"><rect x="10" y="10" width="320" height="104" fill="#FCE7F3"/><circle cx="151" cy="42" r="14" fill="#F97316"/><polygon points="10,114 10,94 31,80 85,74 96,65 248,65 312,70 330,94 330,114" fill="#B9A2EE" opacity="0.7"/><polygon points="168,114 188,28 238,20 330,40 330,114" fill="#6D28D9"/><circle cx="212" cy="100" r="3.5" fill="#FBBF24"/><circle cx="238" cy="87" r="3.5" fill="#FBBF24"/><circle cx="244" cy="74" r="3.5" fill="#FBBF24"/><circle cx="208" cy="61" r="3.5" fill="#FBBF24"/><circle cx="203" cy="48" r="3.5" fill="#FBBF24"/><circle cx="225" cy="35" r="3.5" fill="#FBBF24"/><polygon points="10,114 10,106 106,102 109,95 152,97 291,96 330,106 330,114" fill="#1A0F2B" opacity="1"/></g><rect x="20" y="20" width="128" height="20" rx="10" fill="#FFFFFF"/><text x="84.1" y="34" font-family="Inter, sans-serif" font-weight="700" font-size="11" fill="#6D28D9" text-anchor="middle">Talk · Semaine 16</text><text x="16" y="138" font-family="Inter, sans-serif" font-weight="700" font-size="13" fill="#1A0F2B" text-anchor="start">Au programme</text><circle cx="25" cy="156" r="9" fill="#FBBF24"/><text x="25" y="160" font-family="Inter, sans-serif" font-weight="700" font-size="11" fill="#1A0F2B" text-anchor="middle">1</text><text x="42" y="160" font-family="Inter, sans-serif" font-weight="600" font-size="11" fill="#1A0F2B" text-anchor="start">Pourquoi ton mental flanche souvent quand ça</text><text x="42" y="175" font-family="Inter, sans-serif" font-weight="600" font-size="11" fill="#1A0F2B" text-anchor="start">devient intense ?</text><circle cx="25" cy="195" r="9" fill="#FBBF24"/><text x="25" y="199" font-family="Inter, sans-serif" font-weight="700" font-size="11" fill="#1A0F2B" text-anchor="middle">2</text><text x="42" y="199" font-family="Inter, sans-serif" font-weight="600" font-size="11" fill="#1A0F2B" text-anchor="start">Muscler ton mental, ce n’est pas avoir plus de</text><text x="42" y="214" font-family="Inter, sans-serif" font-weight="600" font-size="11" fill="#1A0F2B" text-anchor="start">volonté</text><circle cx="25" cy="234" r="9" fill="#FBBF24"/><text x="25" y="238" font-family="Inter, sans-serif" font-weight="700" font-size="11" fill="#1A0F2B" text-anchor="middle">3</text><text x="42" y="238" font-family="Inter, sans-serif" font-weight="600" font-size="11" fill="#1A0F2B" text-anchor="start">Et si ton mental était un muscle comme un</text><text x="42" y="253" font-family="Inter, sans-serif" font-weight="600" font-size="11" fill="#1A0F2B" text-anchor="start">autre ?</text><circle cx="25" cy="273" r="9" fill="#FBBF24"/><text x="25" y="277" font-family="Inter, sans-serif" font-weight="700" font-size="11" fill="#1A0F2B" text-anchor="middle">4</text><text x="42" y="277" font-family="Inter, sans-serif" font-weight="600" font-size="11" fill="#1A0F2B" text-anchor="start">Reviens-y souvent</text></svg>