<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 286" width="340" height="286"><rect width="340" height="286" rx="15" fill="#F4EEFC"/><defs><clipPath id="c-fiche-talks-c3.s1"><rect x="10" y="10" width="320" height="104" rx="12"/></clipPath></defs><g clip-path="url(#c-fiche-talks-c3.s1)"><rect x="10" y="10" width="320" height="104" fill="#EDE5FD"/><circle cx="271" cy="42" r="14" fill="#FBBF24"/><polygon points="10,114 10,94 37,83 56,68 76,84 300,83 303,69 330,94 330,114" fill="#B9A2EE" opacity="0.7"/><polygon points="187,114 207,28 257,20 330,40 330,114" fill="#6D28D9"/><circle cx="241" cy="100" r="3.5" fill="#FBBF24"/><circle cx="255" cy="87" r="3.5" fill="#FBBF24"/><circle cx="234" cy="74" r="3.5" fill="#FBBF24"/><circle cx="238" cy="61" r="3.5" fill="#FBBF24"/><circle cx="263" cy="48" r="3.5" fill="#FBBF24"/><circle cx="223" cy="35" r="3.5" fill="#FBBF24"/><polygon points="10,114 10,106 74,97 127,95 251,101 291,99 330,106 330,114" fill="#1A0F2B" opacity="1"/></g><rect x="20" y="20" width="122" height="20" rx="10" fill="#FFFFFF"/><text x="80.8" y="34" font-family="Inter, sans-serif" font-weight="700" font-size="11" fill="#6D28D9" text-anchor="middle">Talk · Semaine 1</text><text x="16" y="138" font-family="Inter, sans-serif" font-weight="700" font-size="13" fill="#1A0F2B" text-anchor="start">Au programme</text><circle cx="25" cy="156" r="9" fill="#FBBF24"/><text x="25" y="160" font-family="Inter, sans-serif" font-weight="700" font-size="11" fill="#1A0F2B" text-anchor="middle">1</text><text x="42" y="160" font-family="Inter, sans-serif" font-weight="600" font-size="11" fill="#1A0F2B" text-anchor="start">Pourquoi est-ce que je m’entraîne ?</text><circle cx="25" cy="180" r="9" fill="#FBBF24"/><text x="25" y="184" font-family="Inter, sans-serif" font-weight="700" font-size="11" fill="#1A0F2B" text-anchor="middle">2</text><text x="42" y="184" font-family="Inter, sans-serif" font-weight="600" font-size="11" fill="#1A0F2B" text-anchor="start">Un bon objectif, ce n’est pas « être plus</text><text x="42" y="199" font-family="Inter, sans-serif" font-weight="600" font-size="11" fill="#1A0F2B" text-anchor="start">fort·e »</text><circle cx="25" cy="219" r="9" fill="#FBBF24"/><text x="25" y="223" font-family="Inter, sans-serif" font-weight="700" font-size="11" fill="#1A0F2B" text-anchor="middle">3</text><text x="42" y="223" font-family="Inter, sans-serif" font-weight="600" font-size="11" fill="#1A0F2B" text-anchor="start">La méthode SMART, version grimpe</text><circle cx="25" cy="243" r="9" fill="#FBBF24"/><text x="25" y="247" font-family="Inter, sans-serif" font-weight="700" font-size="11" fill="#1A0F2B" text-anchor="middle">4</text><text x="42" y="247" font-family="Inter, sans-serif" font-weight="600" font-size="11" fill="#1A0F2B" text-anchor="start">Et si ton objectif n’était pas une cotation mais</text><text x="42" y="262" font-family="Inter, sans-serif" font-weight="600" font-size="11" fill="#1A0F2B" text-anchor="start">une sensation ?</text></svg>