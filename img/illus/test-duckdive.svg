700" font-size="11" fill="#1A0F2B" text-anchor="middle">3</text><text x="42" y="194" font-family="Inter, sans-serif" font-weight="600" font-size="11" fill="#1A0F2B" text-anchor="start">Passer la barre en duck dive par vagues</text><text x="42" y="209" font-family="Inter, sans-serif" font-weight="600" font-size="11" fill="#1A0F2B" text-anchor="start">au-dessus de la tête, en lisant les séries</text><text x="16" y="235" font-family="Inter, sans-serif" font-weight="600" font-size="11" fill="#6D28D9" text-anchor="start">Valide un niveau avant de passer au suivant.</text></svg>