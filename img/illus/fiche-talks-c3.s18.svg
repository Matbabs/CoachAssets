<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 301" width="340" height="301"><rect width="340" height="301" rx="15" fill="#F4EEFC"/><defs><clipPath id="c-fiche-talks-c3.s18"><rect x="10" y="10" width="320" height="104" rx="12"/></clipPath></defs><g clip-path="url(#c-fiche-talks-c3.s18)"><rect x="10" y="10" width="320" height="104" fill="#EDE5FD"/><circle cx="111" cy="36" r="14" fill="#FBBF24"/><polygon points="10,114 10,94 104,70 111,76 195,71 222,69 245,84 330,94 330,114" fill="#B9A2EE" opacity="0.7"/><polygon points="219,114 239,28 289,20 330,40 330,114" fill="#6D28D9"/><circle cx="277" cy="100" r="3.5" fill="#FBBF24"/><circle cx="285" cy="87" r="3.5" fill="#FBBF24"/><circle cx="250" cy="74" r="3.5" fill="#FBBF24"/><circle cx="258" cy="61" r="3.5" fill="#FBBF24"/><circle cx="272" cy="48" r="3.5" fill="#FBBF24"/><circle cx="258" cy="35" r="3.5" fill="#FBBF24"/><polygon points="10,114 10,106 105,102 134,96 272,96 301,97 330,106 330,114" fill="#1A0F2B" opacity="1"/></g><rect x="20" y="20" width="128" height="20" rx="10" fill="#FFFFFF"/><text x="84.1" y="34" font-family="Inter, sans-serif" font-weight="700" font-size="11" fill="#6D28D9" text-anchor="middle">Talk · Semaine 18</text><text x="16" y="138" font-family="Inter, sans-serif" font-weight="700" font-size="13" fill="#1A0F2B" text-anchor="start">Au programme</text><circle cx="25" cy="156" r="9" fill="#FBBF24"/><text x="25" y="160" font-family="Inter, sans-serif" font-weight="700" font-size="11" fill="#1A0F2B" text-anchor="middle">1</text><text x="42" y="160" font-family="Inter, sans-serif" font-weight="600" font-size="11" fill="#1A0F2B" text-anchor="start">Pourquoi jouer avec l’équilibre améliore ta</text><text x="42" y="175" font-family="Inter, sans-serif" font-weight="600" font-size="11" fill="#1A0F2B" text-anchor="start">grimpe ?</text><circle cx="25" cy="195" r="9" fill="#FBBF24"/><text x="25" y="199" font-family="Inter, sans-serif" font-weight="700" font-size="11" fill="#1A0F2B" text-anchor="middle">2</text><text x="42" y="199" font-family="Inter, sans-serif" font-weight="600" font-size="11" fill="#1A0F2B" text-anchor="start">Un bon grimpeur, c’est un corps en mouvement</text><text x="42" y="214" font-family="Inter, sans-serif" font-weight="600" font-size="11" fill="#1A0F2B" text-anchor="start">autour d’un axe instable</text><circle cx="25" cy="234" r="9" fill="#FBBF24"/><text x="25" y="238" font-family="Inter, sans-serif" font-weight="700" font-size="11" fill="#1A0F2B" text-anchor="middle">3</text><text x="42" y="238" font-family="Inter, sans-serif" font-weight="600" font-size="11" fill="#1A0F2B" text-anchor="start">Et si bouger, c’était jouer avec ton équilibre…</text><text x="42" y="253" font-family="Inter, sans-serif" font-weight="600" font-size="11" fill="#1A0F2B" text-anchor="start">au lieu de vouloir le contrôler ?</text><circle cx="25" cy="273" r="9" fill="#FBBF24"/><text x="25" y="277" font-family="Inter, sans-serif" font-weight="700" font-size="11" fill="#1A0F2B" text-anchor="middle">4</text><text x="42" y="277" font-family="Inter, sans-serif" font-weight="600" font-size="11" fill="#1A0F2B" text-anchor="start">Reviens-y souvent</text></svg>