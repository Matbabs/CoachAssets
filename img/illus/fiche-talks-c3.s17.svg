vement dynamique, ce n’est pas sauter</text><text x="42" y="199" font-family="Inter, sans-serif" font-weight="600" font-size="11" fill="#1A0F2B" text-anchor="start">plus fort - c’est sauter juste</text><circle cx="25" cy="219" r="9" fill="#FBBF24"/><text x="25" y="223" font-family="Inter, sans-serif" font-weight="700" font-size="11" fill="#1A0F2B" text-anchor="middle">3</text><text x="42" y="223" font-family="Inter, sans-serif" font-weight="600" font-size="11" fill="#1A0F2B" text-anchor="start">Et si tu redonnais au mouvement dynamique la</text><text x="42" y="238" font-family="Inter, sans-serif" font-weight="600" font-size="11" fill="#1A0F2B" text-anchor="start">place du jeu ?</text><circle cx="25" cy="258" r="9" fill="#FBBF24"/><text x="25" y="262" font-family="Inter, sans-serif" font-weight="700" font-size="11" fill="#1A0F2B" text-anchor="middle">4</text><text x="42" y="262" font-family="Inter, sans-serif" font-weight="600" font-size="11" fill="#1A0F2B" text-anchor="start">Reviens-y souvent</text></svg>