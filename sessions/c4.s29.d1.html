<h3>Jour 1 · Puissance cardiaque</h3>
<p><strong>Puissance cardiaque</strong><br>📊 1 série = 10 min de 30-30</p>
<img src="img/illus/puissance-cardiaque.svg" />
<p>👉 <strong>Comment faire :</strong> Après l'échauffement, saute à la corde 30 s à allure vive mais contrôlée, puis 30 s calmes (sauts lents ou marche sur place). Répète 10 min sans chercher la vitesse max, et ménage tes mollets.</p>
