<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  </head>
  <body>
    <div id="map"></div>
    <style>
      html,
      body {
        height: 100%;
        width: 100%;
        overflow: hidden;
        margin: 0;
        padding: 0;
      }
      #map {
        height: 100%;
        width: 100%;
        image-rendering: -moz-crisp-edges;
        image-rendering: -o-crisp-edges;
        image-rendering: -webkit-optimize-contrast;
        image-rendering: crisp-edges;
        -ms-interpolation-mode: nearest-neighbor;
      }
      .leaflet-tile-pane {
        /* filter: grayscale(100%) brightness(1.1); */
      }
      .pulse {
        border: 2px solid #7f5d00;
        height: 18px;
        width: 18px;
        border-radius: 100%;
        box-shadow: 0 0 5px 0 #8f8156;
        animation: pulsate 1s infinite;
      }
      @keyframes pulsate {
        0% {
          transform: scale(0.1);
        }
        100% {
          transform: scale(1);
        }
      }
      .marker {
        border: 2px solid white;
        background: #ffc000;
        height: 18px;
        width: 18px;
        border-radius: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 5px 0 #8f8156;
      }
      .marker i {
        color: white;
        font-size: 9px;
      }
      .marker-visited {
        border: 2px solid #ffc000;
        background: #ffc000;
        height: 18px;
        width: 18px;
        border-radius: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 5px 0 #8f8156;
      }
      .marker-visited i {
        color: white;
        font-size: 9px;
      }
      .marker-user {
        border: 2px solid white;
        background: #ffc000;
        height: 18px;
        width: 18px;
        border-radius: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 5px 0 #8f8156;
      }
      .marker-user i {
        color: white;
        font-size: 9px;
      }
      .marker-visited-user {
        border: 2px solid #ffc000;
        background: #ffc000;
        height: 18px;
        width: 18px;
        border-radius: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 5px 0 #8f8156;
      }
      .marker-visited-user i {
        color: white;
        font-size: 9px;
      }
      .marker-exploriders {
        background-image: url("https://raw.githubusercontent.com/Matbabs/CoachAssets/refs/heads/main/map/Piment-1.png");
        background-size: contain;
        background-repeat: no-repeat;
        height: 60px;
        width: 60px;
      }
      .marker-exploriders-flipped {
        background-image: url("https://raw.githubusercontent.com/Matbabs/CoachAssets/refs/heads/main/map/Piment-1.png");
        background-size: contain;
        background-repeat: no-repeat;
        height: 60px;
        width: 60px;
        transform: scaleX(-1);
      }
      .marker-spot {
        background: #1976D2;
        border: 2px solid white;
        height: 18px;
        width: 18px;
        border-radius: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 5px 0 #8f8156;
      }
      .marker-spot i {
        color: white;
        font-size: 9px;
      }
      .marker-spot-visited {
        background: #1976D2;
        border: 2px solid #ffc000;
        height: 18px;
        width: 18px;
        border-radius: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 5px 0 #8f8156;
      }
      .marker-spot-visited i {
        color: white;
        font-size: 9px;
      }
      .marker-bivouac {
        background: #F44336;
        border: 2px solid white;
        height: 18px;
        width: 18px;
        border-radius: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 5px 0 #8f8156;
      }
      .marker-bivouac i {
        color: white;
        font-size: 9px;
      }
      .marker-bivouac-visited {
        background: #F44336;
        border: 2px solid #ffc000;
        height: 18px;
        width: 18px;
        border-radius: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 5px 0 #8f8156;
      }
      .marker-bivouac-visited i {
        color: white;
        font-size: 9px;
      }
      .actions {
        margin-top: 7.5px;
        display: flex;
        flex-flow: "row wrap";
        gap: 5px;
      }
      .button {
        background: #ffc000;
        border: 1px solid #ffc000;
        padding: 10px;
        color: white;
        font-weight: bold;
        border-radius: 15px;
        text-transform: uppercase;
      }
      .disabled {
        background: white;
        border: 1px solid grey;
        color: grey;
      }
      .marker-cluster {
        background: rgba(255, 192, 0, 0.6);
      }
      .marker-cluster div {
        background: rgba(255, 192, 0, 0.8);
        color: white;
        font-weight: bold;
        font-size: 14px;
        border-radius: 50%;
        width: 36px;
        height: 36px;
        line-height: 36px;
        text-align: center;
      }
      .marker-cluster-small {
        background: rgba(255, 192, 0, 0.6);
      }
      .marker-cluster-small div {
        background: rgba(255, 192, 0, 0.8);
        width: 30px;
        height: 30px;
        line-height: 30px;
      }
      .marker-cluster-medium {
        background: rgba(255, 192, 0, 0.6);
      }
      .marker-cluster-medium div {
        background: rgba(255, 192, 0, 0.8);
        width: 36px;
        height: 36px;
        line-height: 36px;
      }
      .marker-cluster-large {
        background: rgba(255, 192, 0, 0.6);
      }
      .marker-cluster-large div {
        background: rgba(255, 192, 0, 0.8);
        width: 46px;
        height: 46px;
        line-height: 46px;
      }
    </style>
    <script>
      const MARKER_RADIUS_LIMIT = 50;
      var map = L.map("map", {
        zoomControl: false,
        minZoom: 2,
        maxZoom: 17,
        maxBounds: L.latLngBounds([
          [90, -180],
          [-90, 180],
        ]),
        maxBoundsViscosity: 1.0,
        attributionControl: false,
      }).setView([46.6061, 1.8753], 5);
      var userMarker = undefined;
      var markers = [];
var currentClusterColor = '#ffc000';
var currentUsername = '';
var markerClusterGroup = L.markerClusterGroup({
  maxClusterRadius: 50,
  spiderfyOnMaxZoom: true,
  showCoverageOnHover: false,
  zoomToBoundsOnClick: true,
  disableClusteringAtZoom: 17,
  iconCreateFunction: function(cluster) {
    var count = cluster.getChildCount();
    var size = 'small';
    if (count > 50) size = 'large';
    else if (count > 10) size = 'medium';
    return L.divIcon({
      html: '<div style="background:' + currentClusterColor + ';width:36px;height:36px;line-height:36px;border-radius:50%;color:white;font-weight:bold;font-size:14px;text-align:center;">' + count + '</div>',
      className: '',
      iconSize: L.point(36, 36)
    });
  },
  chunkedLoading: true
});
map.addLayer(markerClusterGroup);
var unclusteredGroup = L.layerGroup().addTo(map);
var classic = L.tileLayer(
        "https://tiles.stadiamaps.com/tiles/alidade_smooth/{z}/{x}/{y}.png",
        { detectRetina: true },
      ).addTo(map);
      var isClassic = true;
      var satellite = L.tileLayer(
        "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
        {
          attribution:
            "Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community",
        },
      );
      var pulseIcon = L.divIcon({
        className: "css-icon",
        html: '<div class="pulse"></div>',
        iconSize: [20, 20],
        iconAnchor: [10.5, 10.5],
      });
      var markerIcon = L.divIcon({
        className: "css-icon",
        html: '<div class="marker"><i class="fa fa-map-marker"></i></div>',
        iconSize: [18, 18],
        iconAnchor: [9, 9],
      });
      var markerVisitedIcon = L.divIcon({
        className: "css-icon",
        html: '<div class="marker-visited"><i class="fa fa-map-marker"></i></div>',
        iconSize: [18, 18],
        iconAnchor: [9, 9],
      });
      var markerIconUser = L.divIcon({
        className: "css-icon",
        html: '<div class="marker-user"><i class="fa fa-user"></i></div>',
        iconSize: [18, 18],
        iconAnchor: [9, 9],
      });
      var markerVisitedIconUser = L.divIcon({
        className: "css-icon",
        html: '<div class="marker-visited-user"><i class="fa fa-user"></i></div>',
        iconSize: [18, 18],
        iconAnchor: [9, 9],
      });
      var exploridersIcon = L.divIcon({
        className: "css-icon",
        html: '<div class="marker-exploriders"></div>',
        iconSize: [60, 60],
        iconAnchor: [30, 60],
      });
      var exploridersIconFlipped = L.divIcon({
        className: "css-icon",
        html: '<div class="marker-exploriders-flipped"></div>',
        iconSize: [60, 60],
        iconAnchor: [30, 60],
      });
      var spotIcon = L.divIcon({
        className: "css-icon",
        html: '<div class="marker-spot"><i class="fa fa-map-pin"></i></div>',
        iconSize: [18, 18],
        iconAnchor: [9, 9],
      });
      var spotVisitedIcon = L.divIcon({
        className: "css-icon",
        html: '<div class="marker-spot-visited"><i class="fa fa-map-pin"></i></div>',
        iconSize: [18, 18],
        iconAnchor: [9, 9],
      });
      var bivouacIcon = L.divIcon({
        className: "css-icon",
        html: '<div class="marker-bivouac"><i class="fa fa-fire"></i></div>',
        iconSize: [18, 18],
        iconAnchor: [9, 9],
      });
      var bivouacVisitedIcon = L.divIcon({
        className: "css-icon",
        html: '<div class="marker-bivouac-visited"><i class="fa fa-fire"></i></div>',
        iconSize: [18, 18],
        iconAnchor: [9, 9],
      });

      // LOCAL FUNCTIONS
      function postMessage(msg) {
        if (window.ReactNativeWebView) {
          window.ReactNativeWebView.postMessage(msg);
        } else if (window.top) {
          window.top.postMessage(msg);
        }
      }
      function updateCoords() {
        msg = JSON.stringify({
          type: "coords",
          data: map.getCenter(),
        });
        postMessage(msg);
      }
      function closeWindows() {
        msg = JSON.stringify({
          type: "close",
        });
        postMessage(msg);
      }
      function visitMarker(markerId) {
        msg = JSON.stringify({
          type: "visit",
          data: {
            id: markerId,
          },
        });
        postMessage(msg);
      }
      function signalMarker(markerId) {
        msg = JSON.stringify({
          type: "signal",
          data: {
            id: markerId,
          },
        });
        postMessage(msg);
      }
      function openGps(lat, lng) {
        msg = JSON.stringify({
          type: "gps",
          data: {
            lat: lat,
            lng: lng,
          },
        });
        postMessage(msg);
      }
      function generatePopup(marker, distanceToUser) {
        let popup = `<b>${marker.name}</b><br>${marker.description}`;
        if (marker.dateIn && marker.timeIn) {
          popup += `<br><br>Début: ${marker.dateIn} - ${marker.timeIn}`;
        }
        if (marker.dateOut && marker.timeOut) {
          popup += `<br>Fin: ${marker.dateOut} - ${marker.timeOut}`;
        }
        if (marker.contact) {
          popup += `<br><br>${marker.contact}`;
        }
        if (marker.type === "exploriders") {
          return popup;
        }
        popup += `<div class="actions">`;
        if (distanceToUser > MARKER_RADIUS_LIMIT) {
          popup += `<button onclick="openGps(${marker.lat}, ${marker.lng})" class="button">itinéraire</button>`;
        } else {
          popup += `<button disabled class="button disabled">itinéraire</button>`;
        }
        if (distanceToUser >= 0 && distanceToUser <= MARKER_RADIUS_LIMIT) {
          popup += `<button onclick="visitMarker('${marker.id}')" class="button">+10 points</button>`;
        } else if (distanceToUser >= 0) {
          popup += `<button disabled class="button disabled">+10 points</button>`;
        }
        if (marker.type !== "exploriders") {
          popup += `<button onclick="signalMarker('${marker.id}')" class="button">signaler</button>`;
        }
        popup += "</div>";
        return popup;
      }
      function userColor(color) {
        switch (color.toLowerCase()) {
          case "#1976D2".toLowerCase():
            return "#19AFD1";
          case "#7CB342".toLowerCase():
            return "#C5D119";
          case "#F44336".toLowerCase():
            return "#D1195D";
          default:
            return "#ffc000";
        }
      }
      map.on("move", updateCoords);
      map.on("click", closeWindows);
      updateCoords();

      // BRIDGE FUNCTIONS
      function addMarker(pos, markerObj, color, distanceToUser) {
        let icon;
        if (markerObj.type === "exploriders") {
          // Use custom marker image if provided, otherwise use default
          const markerImg = markerObj.markerImage || "https://raw.githubusercontent.com/Matbabs/CoachAssets/refs/heads/main/map/Piment-1.png";
          const customIcon = L.divIcon({
            className: "css-icon",
            html: '<div class="marker-exploriders" style="background-image: url(\'' + markerImg + '\');"></div>',
            iconSize: [60, 60],
            iconAnchor: [30, 60],
          });
          const customIconFlipped = L.divIcon({
            className: "css-icon",
            html: '<div class="marker-exploriders-flipped" style="background-image: url(\'' + markerImg + '\');"></div>',
            iconSize: [60, 60],
            iconAnchor: [30, 60],
          });
          icon = markerObj.flipped ? customIconFlipped : customIcon;
        } else if (markerObj.type === "spots") {
          icon = distanceToUser === -2 ? spotVisitedIcon : spotIcon;
        } else if (markerObj.type === "bivouacs") {
          icon = distanceToUser === -2 ? bivouacVisitedIcon : bivouacIcon;
        } else {
          icon = distanceToUser === -2
            ? markerObj.user
              ? markerVisitedIconUser
              : markerVisitedIcon
            : markerObj.user
              ? markerIconUser
              : markerIcon;
        }
        const marker = L.marker(pos, {
          icon: icon,
        });
        marker.bindPopup(generatePopup(markerObj, Number(distanceToUser)));
        
        // User's own marker stays unclustered
        const isUserMarker = markerObj.name === "ExploRider" && 
          (markerObj.description === "Moi" || markerObj.description === currentUsername);
        if (isUserMarker) {
          unclusteredGroup.addLayer(marker);
        } else {
          markerClusterGroup.addLayer(marker);
        }
        markers.push(marker);
        
        // Update cluster color based on marker type
        if (markerObj.type === "spots") {
          currentClusterColor = "#1976D2";
        } else if (markerObj.type === "bivouacs") {
          currentClusterColor = "#F44336";
        } else if (markerObj.type === "sessions") {
          currentClusterColor = "#7CB342";
        } else {
          currentClusterColor = color;
        }
        
        document
          .querySelectorAll(".marker")
          .forEach((e) => (e.style.background = color));
        document
          .querySelectorAll(".marker-visited")
          .forEach((e) => (e.style.background = color));
        document
          .querySelectorAll(".marker-user")
          .forEach((e) => (e.style.background = userColor(color)));
        document
          .querySelectorAll(".marker-visited-user")
          .forEach((e) => (e.style.background = userColor(color)));
        document
          .querySelectorAll(".marker-spot")
          .forEach((e) => (e.style.background = "#1976D2"));
        document
          .querySelectorAll(".marker-spot-visited")
          .forEach((e) => (e.style.background = "#1976D2"));
        document
          .querySelectorAll(".marker-bivouac")
          .forEach((e) => (e.style.background = "#F44336"));
        document
          .querySelectorAll(".marker-bivouac-visited")
          .forEach((e) => (e.style.background = "#F44336"));
      }
      function removeAllMarkers() {
        markerClusterGroup.clearLayers();
        unclusteredGroup.clearLayers();
        markers = [];
        currentClusterColor = '#ffc000';
      }
      function removeUserMarker() {
        const userMarkers = markers.filter(m => {
          try { return unclusteredGroup.hasLayer(m); } catch(e) { return false; }
        });
        userMarkers.forEach(m => unclusteredGroup.removeLayer(m));
        markers = markers.filter(m => !userMarkers.includes(m));
      }
      function setClusterColor(color) {
        currentClusterColor = color;
      }
      function setUsername(name) {
        currentUsername = name;
      }
      function setMarkerImage(url) {
        document.querySelectorAll('.marker-exploriders').forEach(el => {
          el.style.backgroundImage = `url("${url}")`;
        });
        document.querySelectorAll('.marker-exploriders-flipped').forEach(el => {
          el.style.backgroundImage = `url("${url}")`;
        });
        // Recreate icons with new image
        exploridersIcon = L.divIcon({
          className: "css-icon",
          html: '<div class="marker-exploriders" style="background-image: url(\'' + url + '\');"></div>',
          iconSize: [60, 60],
          iconAnchor: [30, 60],
        });
        exploridersIconFlipped = L.divIcon({
          className: "css-icon",
          html: '<div class="marker-exploriders-flipped" style="background-image: url(\'' + url + '\');"></div>',
          iconSize: [60, 60],
          iconAnchor: [30, 60],
        });
        // Update existing markers on the map
        markers.forEach(function(m) {
          if (m.options.icon && m.options.icon.options.html && m.options.icon.options.html.includes('marker-exploriders')) {
            const isFlipped = m.options.icon.options.html.includes('flipped');
            m.setIcon(isFlipped ? exploridersIconFlipped : exploridersIcon);
          }
        });
      }
      function locate(pos) {
        if (userMarker) {
          map.removeLayer(userMarker);
        }
        userMarker = L.marker(pos, { icon: pulseIcon });
        userMarker.addTo(map);
      }
      function setView(pos, zoom) {
        map.setView(pos, zoom);
      }
      function switchMap() {
        if (isClassic) {
          map.removeLayer(classic);
          satellite.addTo(map);
        } else {
          map.removeLayer(satellite);
          classic.addTo(map);
        }
        for (let i = 0; i < document.styleSheets.length; i++) {
          for (let j = 0; j < document.styleSheets[i].rules.length; j++) {
            if (document.styleSheets[i].rules[j].selectorText === ".pulse") {
              document.styleSheets[i].rules[j].style.borderColor = !isClassic
                ? "#7f5d00"
                : "#ffc000";
            }
          }
        }
        isClassic = !isClassic;
        let msg = JSON.stringify({
          type: "isClassic",
          data: isClassic,
        });
        postMessage(msg);
      }
function signalAlert(alertId) {
        msg = JSON.stringify({
          type: "signalAlert",
          data: {
            id: alertId,
          },
        });
        postMessage(msg);
      }
      function addAlertMarker(pos, alertObj) {
        const alertTypeLabels = {
          works: "Travaux",
          animal: "Animal",
          route_closed: "Route fermée",
          flood: "Pluie inondation",
          wind: "Vent fort",
          storm: "Orages",
          swell: "Vague submersion",
          snow: "Neige verglas",
          avalanche: "Avalanche",
          flood_river: "Crue",
          hunting: "Chasse en cours",
          prefectoral: "Arrêté préfectoral",
          custom: "Autre",
        };
        const alertColors = {
          works: "#FF8C00",
          animal: "#8B4513",
          route_closed: "#424242",
          flood: "#1976D2",
          wind: "#87CEEB",
          storm: "#4B0082",
          swell: "#1976D2",
          snow: "#1976D2",
          avalanche: "#F44336",
          flood_river: "#9C27B0",
          hunting: "#8B4513",
          prefectoral: "#4A4A4A",
          custom: "#808080",
        };
        const alertIcons = {
          works: "fa-wrench",
          animal: "fa-paw",
          route_closed: "fa-road",
          flood: "fa-tint",
          wind: "fa-cloud",
          storm: "fa-bolt",
          swell: "fa-life-ring",
          snow: "fa-snowflake",
          avalanche: "fa-snowflake",
          flood_river: "fa-tint",
          hunting: "fa-crosshairs",
          prefectoral: "fa-gavel",
          custom: "fa-comment",
        };
        const label = alertObj.type === "custom" && alertObj.customText ? alertObj.customText : (alertTypeLabels[alertObj.type] || "Alerte");
        const color = alertColors[alertObj.type] || "#F44336";
        const iconName = alertIcons[alertObj.type] || "fa-exclamation";
        const expiresIn = Math.max(0, alertObj.expiresAt - Date.now());
        const hoursLeft = Math.floor(expiresIn / (1000 * 60 * 60));
        const minutesLeft = Math.floor((expiresIn % (1000 * 60 * 60)) / (1000 * 60));
        const timeLeft = hoursLeft > 0 ? `${hoursLeft}h${minutesLeft}m` : `${minutesLeft}m`;
        const alertIcon = L.divIcon({
          className: "css-icon",
          html: `<div class="marker" style="background:${color};border:2px solid white;display:flex;align-items:center;justify-content:center;"><i class="fa ${iconName}" style="color:white;font-size:12px;"></i></div>`,
          iconSize: [24, 24],
          iconAnchor: [12, 12],
        });
        const marker = L.marker(pos, { icon: alertIcon });
        let popup = `<b>${label}</b><br>il y a ${timeLeft}`;
        if (alertObj.userId) {
          popup += `<div class="actions">`;
          popup += `<button onclick="signalAlert('${alertObj.id}')" class="button">signaler</button>`;
          popup += `</div>`;
        }
        marker.bindPopup(popup);
        markerClusterGroup.addLayer(marker);
        markers.push(marker);
      }
    </script>
  </body>
</html>
